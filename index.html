<style>
  :root{
    --cream:#FAF7F0; --charcoal:#121215; --charcoal-2:#1a1a1e;
    --navy:#1F3A5C; --navy-2:#152941;
    --gold:#D4A017; --gold-glow:#fbbf24;
    --text-1:#1c1917; --text-2:#78716c;
    --text-1-d:#f4f4f5; --text-2-d:#a1a1aa;
  }
  html.dark{ --cream:var(--charcoal); }
  *{ -webkit-tap-highlight-color:transparent; }
  body{ background:var(--cream); color:var(--text-1); font-family:'Tajawal','Inter',sans-serif; transition:background .3s; }
  html.dark body{ color:var(--text-1-d); }
  html[dir="ltr"] body{ font-family:'Inter','Tajawal',sans-serif; }
  .font-display{ font-family:'Playfair Display','Cormorant Garamond',serif; }
  html[dir="rtl"] .font-display{ font-family:'Tajawal',serif; font-weight:800; }

  .cat-scroll{ scrollbar-width:none; -ms-overflow-style:none; }
  .cat-scroll::-webkit-scrollbar{ display:none; }

  .cat-chip{ transition:all .25s ease; }
  .cat-chip.active{
    background:var(--navy); color:#fff;
    box-shadow:0 0 0 3px rgba(212,160,23,.18), 0 8px 20px -6px rgba(31,58,92,.55);
  }
  html.dark .cat-chip{ background:#232327; color:var(--text-2-d); }
  html.dark .cat-chip.active{ background:var(--navy); color:#fff; }

  .item-card{ transition:transform .25s ease, box-shadow .25s ease; }
  .item-card:active{ transform:scale(.98); }

  .badge-new{ background:#166534; }
  .badge-best{ background:var(--gold); color:#1c1917;}
  .badge-spicy{ background:#B91C1C; }

  #modalBackdrop{ backdrop-filter:blur(6px); }
  .modal-sheet{ animation:slideUp .3s ease both; }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .fade{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .card-shadow{ box-shadow:0 8px 24px -10px rgba(28,25,23,.18); }
  html.dark .card-shadow{ box-shadow:0 8px 24px -10px rgba(0,0,0,.6); }

  .surface{ background:#fff; }
  html.dark .surface{ background:var(--charcoal-2); }
  .text-muted{ color:var(--text-2); }
  html.dark .text-muted{ color:var(--text-2-d); }
</style>
</head>

<script>
/* ---------- i18n ---------- */
const I18N = {
  ar: { brandName:"كلوب 21", brandTag:"استمتع بالأجواء", searchPh:"ابحث عن طبق...", noResults:"لا توجد أصناف مطابقة" },
  en: { brandName:"Club 21", brandTag:"Enjoy The Mood", searchPh:"Search a dish...", noResults:"No matching items" }
};
let lang = 'en';

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = I18N[lang][el.dataset.i18n];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    el.placeholder = I18N[lang][el.dataset.i18nPh];
  });
  document.getElementById('langLabel').textContent = lang === 'ar' ? 'EN' : 'AR';
}

function toggleLang(){
  lang = lang === 'ar' ? 'en' : 'ar';
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  applyI18n();
  renderCats();
  renderGrid(activeCat, searchQuery);
}

function toggleDark(){
  document.documentElement.classList.toggle('dark');
}

function toggleSearch(){
  const bar = document.getElementById('searchBar');
  bar.classList.toggle('hidden');
  if(!bar.classList.contains('hidden')) document.getElementById('searchInput').focus();
}

function shareMenu(){
  const url = window.location.href;
  if(navigator.share){
    navigator.share({ title:'Club 21', text:'Club 21 — Enjoy The Mood', url });
  } else {
    navigator.clipboard?.writeText(url);
    alert(lang==='ar' ? 'تم نسخ الرابط' : 'Link copied');
  }
}

const TAG_LABEL = {
  ar: { new:'جديد', best:'الأكثر طلباً', spicy:'حار' },
  en: { new:'New', best:'Bestseller', spicy:'Spicy' }
};
const TAG_CLASS = { new:'badge-new', best:'badge-best', spicy:'badge-spicy' };

let activeCat = CATS[0].id;
let searchQuery = '';

function imgUrl(id, w){ return `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w||600}&q=80`; }

function renderCats(){
  const scroll = document.getElementById('catScroll');
  scroll.innerHTML = CATS.map(c => `
    <button data-cat="${c.id}" class="cat-chip shrink-0 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap surface card-shadow ${c.id===activeCat?'active':''}">
      ${lang==='ar' ? c.ar : c.en}
    </button>`).join('');
  scroll.querySelectorAll('.cat-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCat = btn.dataset.cat;
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      renderCats();
      renderGrid(activeCat, '');
      document.getElementById('grid').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function onSearch(q){
  searchQuery = q.trim();
  renderGrid(activeCat, searchQuery);
}

function renderGrid(catId, query){
  const grid = document.getElementById('grid');
  const titleEl = document.getElementById('activeCatTitle');
  const noResults = document.getElementById('noResults');
  let results = [];

  if(query){
    titleEl.textContent = lang==='ar' ? `نتائج البحث: "${query}"` : `Results for "${query}"`;
    CATS.forEach(c=>{
      c.items.forEach(it=>{
        const [ar,en,desc,price] = it;
        if((ar+en+desc).toLowerCase().includes(query.toLowerCase())){
          results.push({...packItem(it), catImg:c.img});
        }
      });
    });
  } else {
    const cat = CATS.find(c=>c.id===catId);
    titleEl.textContent = lang==='ar' ? cat.ar : cat.en;
    results = cat.items.map(it => ({...packItem(it), catImg:cat.img}));
  }

  grid.classList.remove('fade'); void grid.offsetWidth; grid.classList.add('fade');

  if(results.length === 0){
    grid.innerHTML = '';
    noResults.classList.remove('hidden');
    return;
  }
  noResults.classList.add('hidden');

  grid.innerHTML = results.map((it, idx) => `
    <button onclick='openModal(${JSON.stringify(it).replace(/'/g,"&apos;")})' class="item-card surface rounded-2xl overflow-hidden card-shadow text-start relative">
      ${it.tag ? `<span class="absolute top-2 start-2 z-10 text-[10px] font-bold px-2 py-0.5 rounded-full text-white ${TAG_CLASS[it.tag]}">${TAG_LABEL[lang][it.tag]}</span>` : ''}
      <div class="h-24 sm:h-28 overflow-hidden">
        <img src="${imgUrl(it.catImg)}" class="w-full h-full object-cover" alt="${it.name}" loading="lazy">
      </div>
      <div class="p-2.5">
        <p class="text-xs sm:text-sm font-semibold leading-tight line-clamp-2">${it.name}</p>
        <p class="text-[13px] font-display text-[var(--gold)] mt-1">${it.price} ${lang==='ar'?'ج.م':'EGP'}</p>
      </div>
    </button>
  `).join('');
}

function packItem(it){
  const [ar,en,desc,price,tag] = it;
  return { name: lang==='ar'?ar:en, name_ar:ar, name_en:en, desc, price, tag: tag||null };
}

function openModal(it){
  document.getElementById('modalImg').src = imgUrl(it.catImg, 900);
  document.getElementById('modalTitle').textContent = it.name;
  document.getElementById('modalDesc').textContent = it.desc;
  document.getElementById('modalPrice').textContent = `${it.price} ${lang==='ar'?'ج.م':'EGP'}`;
  const badge = document.getElementById('modalBadge');
  if(it.tag){
    badge.textContent = TAG_LABEL[lang][it.tag];
    badge.className = `absolute top-3 start-3 text-[11px] font-bold px-2.5 py-1 rounded-full text-white ${TAG_CLASS[it.tag]}`;
  } else {
    badge.classList.add('hidden');
  }
  document.getElementById('modalBackdrop').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.add('hidden'); }

/* ---------- init ---------- */
applyI18n();
renderCats();
renderGrid(activeCat, '');
</script>
